---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-edge
  namespace: alloy-edge
spec:
  alloy:
    configMap:
      content: |-
        // Alloy's own internal metrics. An in-process exporter has no pod identity of
        // its own, so the labels a pod scrape would have attached are set here instead.
        prometheus.exporter.self "edge" { }

        discovery.relabel "self" {
        	targets = prometheus.exporter.self.edge.targets

        	rule {
        		target_label = "job"
        		replacement  = "alloy-edge"
        	}

        	rule {
        		target_label = "namespace"
        		replacement  = sys.env("POD_NAMESPACE")
        	}

        	rule {
        		target_label = "pod"
        		replacement  = sys.env("POD_NAME")
        	}
        }

        prometheus.scrape "self" {
        	targets         = discovery.relabel.self.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }
        // The router is polled by the standalone snmp_exporter in multi-target mode:
        // this scrape hands it a target and it performs the SNMPv3 query. Scraped
        // natively rather than through an OTLP conversion, so the counter names arrive
        // unsuffixed, which is what snmp-observ-lib queries.
        discovery.relabel "snmp_mikrotik" {
        	targets = [{
        		__address__ = "192.168.10.1",
        		instance    = "mikrotik-router",
        	}]
        	// Keep the polled address on every series as `target` for scrape debugging;
        	// `instance` carries the device name.
        	rule {
        		source_labels = ["__address__"]
        		target_label  = "__param_target"
        	}

        	rule {
        		source_labels = ["__address__"]
        		target_label  = "target"
        	}

        	rule {
        		target_label = "__address__"
        		replacement  = "prometheus-snmp-exporter.prometheus-snmp-exporter.svc.cluster.local:9116"
        	}
        }

        prometheus.scrape "snmp_mikrotik" {
        	targets         = discovery.relabel.snmp_mikrotik.output
        	job_name        = "snmp-mikrotik"
        	scrape_interval = "60s"
        	scrape_timeout  = "30s"
        	metrics_path    = "/snmp"
        	params          = {
        		// hrDevice (hrProcessorLoad = CPU) and hrStorage (memory) are built-in
        		// snmp_exporter modules; RouterOS serves both via HOST-RESOURCES-MIB.
        		module = ["if_mib", "mikrotik", "system", "hrStorage", "hrDevice"],
        		auth   = ["mikrotik_v3"],
        	}
        	forward_to = [prometheus.remote_write.default.receiver]
        }
        // `topics` is the RFC3164 tag. The device fills it from a per-rule prefix, one
        // alphanumeric token naming the category, so a line is labelled by the rule that
        // logged it rather than by its own topic list; the parser strips it from the
        // stored body. Rules carrying no prefix produce no label, which is deliberate
        // for the severity ones, since severity is already `level`. Keep the hostname as
        // `host`: it is constant for one device, but it is the only thing distinguishing
        // senders if another is pointed at this listener. Take the level from
        // the priority rather than the line: syslog-severity is auto on the device, so
        // the real per-message severity is on the wire. RFC spellings are normalised to
        // the short forms Grafana colours. Emitting `level` rather than `detected_level`
        // is deliberate: Loki derives detected_level from it, whereas setting that name
        // directly collides with Loki's own detection and it files its result as
        // detected_level_extracted instead.
        loki.relabel "syslog" {
        	forward_to = []

        	rule {
        		source_labels = ["__syslog_message_app_name"]
        		target_label  = "topics"
        	}

        	rule {
        		source_labels = ["__syslog_message_hostname"]
        		target_label  = "host"
        	}

        	rule {
        		source_labels = ["__syslog_message_severity"]
        		target_label  = "level"
        	}

        	rule {
        		source_labels = ["level"]
        		regex         = "informational"
        		target_label  = "level"
        		replacement   = "info"
        	}

        	rule {
        		source_labels = ["level"]
        		regex         = "warning"
        		target_label  = "level"
        		replacement   = "warn"
        	}
        }
        // The device pushes BSD syslog over UDP to a LAN VIP. Handled by Loki's own
        // source rather than an OTLP receiver and transform, since these logs only ever
        // go to Loki and the round trip through OTLP buys nothing.
        loki.source.syslog "network_devices" {
        	listener {
        		address  = "0.0.0.0:5514"
        		protocol = "udp"
        		// RouterOS offers cef, default and syslog for remote-log-format, and its
        		// "syslog" is BSD-syslog, so RFC3164 is the only real syslog it speaks.
        		// The BSD timestamp carries no year, hence the default below. Note that
        		// setting syslog-time-format=iso8601 on the device breaks this parser.
        		syslog_format                   = "rfc3164"
        		rfc3164_default_to_current_year = true
        		// service_name is the label Loki would otherwise derive for itself, and
        		// the one these logs are queried by.
        		labels = {
        			service_name = "mikrotik",
        		}
        	}
        	relabel_rules = loki.relabel.syslog.rules
        	forward_to    = [loki.write.default.receiver]
        }

        loki.write "default" {
        	external_labels = {
        		cluster = "home",
        	}

        	endpoint {
        		url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        	}
        }
        // OTLP pushed from outside the cluster, currently Claude Code on the Mac
        // reaching the Tailscale ingress. No k8sattributes here: the senders are not
        // pods, and this collector holds no Kubernetes credentials by design.
        otelcol.receiver.otlp "external" {
        	grpc {
        		endpoint = "0.0.0.0:4317"
        	}

        	http {
        		endpoint = "0.0.0.0:4318"
        	}

        	output {
        		logs    = [otelcol.exporter.otlphttp.external.input]
        		metrics = [otelcol.processor.transform.external.input]
        	}
        }

        // Resource attributes do not become Prometheus labels on their own; they land
        // on target_info instead. The collector being replaced copied them all with
        // resource_to_telemetry_conversion. Promoting the four that carry meaning keeps
        // these series identical to the in-cluster senders, which do the same thing.
        otelcol.processor.transform "external" {
        	error_mode = "ignore"

        	metric_statements {
        		context = "datapoint"

        		statements = [
        			`set(attributes["host.arch"], resource.attributes["host.arch"])`,
        			`set(attributes["os.type"], resource.attributes["os.type"])`,
        			`set(attributes["os.version"], resource.attributes["os.version"])`,
        			`set(attributes["service.version"], resource.attributes["service.version"])`,
        		]
        	}

        	output {
        		metrics = [otelcol.exporter.prometheus.external.input]
        	}
        }

        // Loki's own OTLP ingestion maps resource attributes to index labels and the
        // rest to structured metadata, with the body as the line.
        otelcol.exporter.otlphttp "external" {
        	client {
        		endpoint = "http://loki-gateway.loki.svc.cluster.local/otlp"

        		tls {
        			insecure = true
        		}
        	}
        }

        otelcol.exporter.prometheus "external" {
        	forward_to = [prometheus.remote_write.default.receiver]
        }

        prometheus.remote_write "default" {
        	external_labels = {
        		cluster = "home",
        	}

        	endpoint {
        		url = "http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
        	}
        }
