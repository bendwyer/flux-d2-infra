---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-node
  namespace: alloy-node
spec:
  alloy:
    configMap:
      content: |-
        // Alloy's own internal metrics. alloy_* series, not otelcol_*.
        prometheus.exporter.self "node" { }

        discovery.relabel "self" {
        	targets = prometheus.exporter.self.node.targets

        	rule {
        		target_label = "job"
        		replacement  = "alloy-node"
        	}

        	// An in-process exporter has no pod identity of its own, so the labels a
        	// pod scrape would have attached are set here instead.
        	rule {
        		target_label = "namespace"
        		replacement  = sys.env("POD_NAMESPACE")
        	}

        	rule {
        		target_label = "pod"
        		replacement  = sys.env("POD_NAME")
        	}
        }

        prometheus.scrape "self" {
        	targets         = discovery.relabel.self.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // This node only. The field selector filters server-side, so each pod
        // watches one node's worth of objects instead of the whole cluster.
        discovery.kubernetes "local_node" {
        	role = "node"

        	selectors {
        		role  = "node"
        		field = "metadata.name=" + sys.env("NODE_NAME")
        	}
        }

        discovery.kubernetes "local_pods" {
        	role = "pod"

        	selectors {
        		role  = "pod"
        		field = "spec.nodeName=" + sys.env("NODE_NAME")
        	}
        }

        // Node role already addresses the kubelet on :10250, so no rewrite needed.
        discovery.relabel "kubelet" {
        	targets = discovery.kubernetes.local_node.targets

        	rule {
        		target_label = "job"
        		replacement  = "kubelet"
        	}
        }

        prometheus.scrape "kubelet" {
        	targets           = discovery.relabel.kubelet.output
        	scrape_interval   = "30s"
        	scheme            = "https"
        	bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        	forward_to        = [prometheus.remote_write.default.receiver]

        	tls_config {
        		insecure_skip_verify = true
        	}
        }

        // cadvisor is the same endpoint under a different path, and keeps the
        // kubelet job label because that is what kubernetes-mixin queries expect.
        prometheus.scrape "cadvisor" {
        	targets           = discovery.relabel.kubelet.output
        	scrape_interval   = "30s"
        	scheme            = "https"
        	metrics_path      = "/metrics/cadvisor"
        	bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        	forward_to        = [prometheus.remote_write.default.receiver]

        	tls_config {
        		insecure_skip_verify = true
        	}
        }

        discovery.relabel "kube_proxy" {
        	targets = discovery.kubernetes.local_node.targets

        	rule {
        		source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        		target_label  = "__address__"
        		replacement   = "$1:10249"
        	}

        	rule {
        		target_label = "job"
        		replacement  = "kube-proxy"
        	}
        }

        prometheus.scrape "kube_proxy" {
        	targets         = discovery.relabel.kube_proxy.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // node-exporter declares its port, so discovery addresses it directly
        // rather than assuming a host port on the node IP.
        discovery.relabel "node_exporter" {
        	targets = discovery.kubernetes.local_pods.targets

        	rule {
        		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        		action        = "keep"
        		regex         = "prometheus-node-exporter"
        	}

        	rule {
        		source_labels = ["__meta_kubernetes_pod_container_port_number"]
        		action        = "keep"
        		regex         = "9100"
        	}

        	rule {
        		target_label = "job"
        		replacement  = "node-exporter"
        	}
        }

        prometheus.scrape "node_exporter" {
        	targets         = discovery.relabel.node_exporter.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // longhorn-manager binds :9500 on the pod IP, which it does not declare.
        discovery.relabel "longhorn" {
        	targets = discovery.kubernetes.local_pods.targets

        	rule {
        		source_labels = ["__meta_kubernetes_pod_label_app"]
        		action        = "keep"
        		regex         = "longhorn-manager"
        	}

        	rule {
        		source_labels = ["__meta_kubernetes_pod_ip"]
        		target_label  = "__address__"
        		replacement   = "$1:9500"
        	}

        	rule {
        		target_label = "job"
        		replacement  = "longhorn"
        	}
        }

        prometheus.scrape "longhorn" {
        	targets         = discovery.relabel.longhorn.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // Straight to Prometheus rather than through the gateway: no OTLP round
        // trip is the point, so the cluster label has to be added here instead.
        prometheus.remote_write "default" {
        	external_labels = {
        		cluster = "home",
        	}

        	endpoint {
        		url = "http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
        	}
        }
