---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-node
  namespace: alloy-node
spec:
  # spec mirrors the Alloy Helm chart's values file one-for-one.
  controller:
    type: daemonset
  rbac:
    create: true
    clusterRules:
      - apiGroups: [""]
        resources: [nodes, nodes/proxy, nodes/metrics, pods]
        verbs: [get, list, watch]
      - nonResourceURLs: [/metrics, /metrics/cadvisor]
        verbs: [get]
  alloy:
    # The chart's HOSTNAME is already spec.nodeName; declared here anyway to
    # keep the config off chart-internal names.
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 256Mi
