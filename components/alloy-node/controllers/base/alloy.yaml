---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-node
  namespace: alloy-node
spec:
  # spec mirrors the Alloy Helm chart's values file one-for-one.
  controller:
    type: daemonset
    # Writable target for the storage path, since the root filesystem is not.
    volumes:
      extra:
        - name: storage
          emptyDir: {}
  global:
    # The uids are per-container: the two images are built for different users.
    # fsGroup makes the storage volume writable by the group Alloy runs as.
    #
    # Group 0 is added because Talos writes pod logs root:root, group-readable,
    # so membership of that group is what grants read access, not the uid. The
    # collector this replaces reads them the same way, as uid 10001 with gid 0.
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 473
      supplementalGroups: [0]
      seccompProfile:
        type: RuntimeDefault
  configReloader:
    securityContext:
      # 65534 is the nobody user this image is built for.
      runAsUser: 65534
      runAsGroup: 65534
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  rbac:
    create: true
    # The ClusterRole is rules plus clusterRules concatenated, and both carry
    # broad chart defaults covering components this collector does not run, so
    # both are overridden. Neither may be an empty list: the template renders
    # them in sequence and a literal [] in the middle is invalid YAML.
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
    clusterRules:
      - apiGroups: [""]
        resources: [nodes, nodes/metrics]
        verbs: [get, list, watch]
      - nonResourceURLs: [/metrics, /metrics/cadvisor]
        verbs: [get]
  alloy:
    # Drop capabilities only while no eBPF component is configured: upstream
    # calls out beyla.ebpf and pyroscope.ebpf as needing root or extra ones.
    securityContext:
      # 473 is the image's built-in alloy user, which owns /usr/bin/alloy and
      # /etc/alloy. The image sets no USER, so it defaults to root.
      runAsUser: 473
      runAsGroup: 473
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    mounts:
      # Host pod logs, read-only, for the log collection pipeline.
      varlog: true
      extra:
        - name: storage
          mountPath: /tmp/alloy
    # The chart's HOSTNAME is already spec.nodeName; declared here anyway to
    # keep the config off chart-internal names.
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      # Self-metrics come from an in-process exporter, not a pod scrape, so the
      # namespace and pod labels every Grafana dashboard expects have to be
      # supplied rather than discovered.
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 256Mi
