---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: external-dns-crds
  namespace: external-dns
spec:
  sources:
    - alias: chart
      kind: OCIRepository
      name: external-dns
  artifacts:
    - name: external-dns-crds
      # Tied to the chart's revision, so the CRDs move only when the chart does.
      originRevision: "@chart"
      copy:
        - from: "@chart/external-dns/crds/**"
          to: "@artifact/"
