---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-gateway
  namespace: opentelemetry-collector-gateway
spec:
  interval: 1h
  values:
    # A second OTLP port for telemetry pushed by in-cluster applications, kept
    # apart from 4317 so it can be exported with different settings. The node
    # collector forwards application traffic here; nothing else uses it.
    ports:
      otlp-apps:
        enabled: true
        containerPort: 4319
        servicePort: 4319
        protocol: TCP
        appProtocol: grpc
    config:
      receivers:
        otlp/apps:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4319
      processors:
        # Override preset: drop `from: connection` — it misattributes OTLP-received metrics to the sender pod.
        k8s_attributes:
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
      exporters:
        prometheus_remote_write:
          endpoint: http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write
          external_labels:
            cluster: home
          timeout: 30s
          remote_write_queue:
            enabled: true
            queue_size: 1000
            num_consumers: 5
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 5m
        # Same destination as above, with resource attributes copied onto every
        # series. External clients already get this from the edge collector, so
        # in-cluster applications need it too or the same metric ends up with two
        # different label sets. It cannot be enabled on the exporter above,
        # which carries every scraped metric in the cluster.
        prometheus_remote_write/apps:
          endpoint: http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write
          external_labels:
            cluster: home
          timeout: 30s
          remote_write_queue:
            enabled: true
            queue_size: 1000
            num_consumers: 5
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 5m
          resource_to_telemetry_conversion:
            enabled: true
            exclude_service_attributes: true
        otlp_http/loki:
          endpoint: http://loki-gateway.loki.svc.cluster.local:80/otlp
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch
            exporters:
              - prometheus_remote_write
          logs:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlp_http/loki
          # Application telemetry forwarded by the node collectors. Kept in its
          # own pipelines so it can use the converting exporter, and so the
          # chart's kubernetesAttributes preset leaves it alone: the preset only
          # touches pipelines named exactly logs, metrics and traces, and pod
          # identity is already attached at the node.
          metrics/apps:
            receivers:
              - otlp/apps
            processors:
              - memory_limiter
              - batch
            exporters:
              - prometheus_remote_write/apps
          logs/apps:
            receivers:
              - otlp/apps
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlp_http/loki
        telemetry:
          metrics:
            level: detailed
          resource:
            service.namespace: gateway
            service.instance.id: ${env:OTEL_K8S_POD_NAME}
