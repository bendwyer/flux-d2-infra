---
# Injects env vars into k8up backup pods.
#
# RESTIC_EXCLUDE excludes the ext4 lost+found directory which is owned by
# root:root with restrictive permissions and cannot be read by the backup pod.
#
# AWS_DEFAULT_REGION is set here because Schedule.backend.s3 has no region
# field. OVH's io endpoint validates the SigV4 region case-sensitively, so the
# lowercase form is passed explicitly rather than relying on the client
# discovering it.
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup-exclude-lost-found
  namespace: tsidp
spec:
  template:
    spec:
      containers:
        - name: k8up
          env:
            - name: RESTIC_EXCLUDE
              value: lost+found
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: ovhcloud-k8up-home-s3
                  key: AWS_DEFAULT_REGION
