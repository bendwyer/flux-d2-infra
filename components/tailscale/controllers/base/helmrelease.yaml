---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: tailscale
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    operatorConfig:
      defaultTags:
        - tag:k8s-operator
      image:
        repository: ghcr.io/tailscale/k8s-operator
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
      # Applies to proxies the operator mints from an Ingress or a Service; ProxyGroups
      # and the Connector name their class directly. The ProxyClass itself is created by
      # the configs Kustomization, which reconciles after this one, so on a cold start
      # the operator logs that the class is not ready and retries until it appears.
      defaultProxyClass: no-capabilities
    oauthSecretVolume:
      secret:
        secretName: tailscale
        items:
          - key: username
            path: client_id
          - key: credential
            path: client_secret
