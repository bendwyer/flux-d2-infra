---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
  namespace: flux-operator-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  values:
    transport: http
    readonly: false
    # The chart's own binding is cluster-admin; the scoped roles beside this
    # file replace it.
    rbac:
      create: false
    # On by default; set here because the Secret read in the scoped role
    # relies on it.
    extraArgs:
      - --mask-secrets=true
    networkPolicy:
      ingress:
        namespaces:
          - tailscale
          - toolhive
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: null
        memory: 128Mi
