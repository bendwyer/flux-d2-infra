---
# What the MCP server may do beyond the built-in `view` role (bound separately):
# the cluster-scoped reads `view` omits, Secrets, and patch on Flux objects,
# which is how its reconcile, suspend and resume tools work. Its apply, delete
# and general patch tools stay listed but are refused; anything more is done
# with a human-authenticated identity, not through this server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-operator-mcp-operate
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # Keys, type and ownership help diagnose a missing or misnamed Secret. The
  # server replaces every value with **** (--mask-secrets, set in the
  # HelmRelease), so the contents never reach the client.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - fluxcd.controlplane.io
    resources: ["*"]
    verbs: ["get", "list", "watch", "patch"]
