---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8up
  namespace: k8up
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8up
  values:
    k8up:
      envVars:
        - name: BACKUP_PROMURL
          value: http://prometheus-pushgateway.prometheus-pushgateway.svc.cluster.local:9091
