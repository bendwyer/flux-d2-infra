---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-edge
  namespace: opentelemetry-collector-edge
spec:
  interval: 1h
  values:
    # Headroom left over from when this collector also ran the syslog receiver
    # and the SNMP scrape. Both have moved to alloy-edge and OTLP is all that
    # remains, so this can drop back once that moves too and the component goes.
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 50m
        memory: 384Mi
    config:
      receivers:
      processors:
      exporters:
        prometheus_remote_write:
          endpoint: http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write
          external_labels:
            cluster: home
          resource_to_telemetry_conversion:
            enabled: true
            exclude_service_attributes: true
        otlp_http/loki:
          endpoint: http://loki-gateway.loki.svc.cluster.local:80/otlp
          tls:
            insecure: true
      service:
        pipelines:
          metrics:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch
            exporters:
              - prometheus_remote_write
          logs:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlp_http/loki
        telemetry:
          metrics:
            level: detailed
          resource:
            service.namespace: edge
            service.instance.id: ${env:OTEL_K8S_POD_NAME}
