---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive
  namespace: toolhive
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhive
  dependsOn:
    - name: toolhive-crds
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    operator:
      env:
        # The operator passes this on to every MCPServer, proxy and gateway it deploys.
        - name: TOOLHIVE_USAGE_METRICS_ENABLED
          value: "false"
