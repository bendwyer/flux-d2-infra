---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/onepassword.com/onepassworditem_v1.json
# Named after the component on purpose: the configs Kustomization substitutes
# variables from Secret/toolhive, which is how ${TSIDP_CLIENT_ID} reaches
# mcpoidcconfig-tsidp.yaml without the client ID being committed. Every field of
# the 1Password item becomes a variable, so the item holds only TSIDP_CLIENT_ID
# and TSIDP_CLIENT_SECRET. It lives in controllers so the Secret already exists
# when configs is built.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: toolhive
  namespace: toolhive
spec:
  itemPath: "vaults/4kbytax7eoweefgrkbg2af6oxu/items/p2t3kffvszyu2s67xrniuk534m"
