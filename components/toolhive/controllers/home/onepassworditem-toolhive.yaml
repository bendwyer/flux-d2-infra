---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/onepassword.com/onepassworditem_v1.json
# Named after the component on purpose: the configs Kustomization substitutes
# variables from Secret/toolhive, which is how ${TSIDP_CLIENT_ID} and
# ${K8S_SA_ISSUER} reach the MCPOIDCConfigs without being committed. Every field
# of the 1Password item becomes a variable, so the item holds only
# TSIDP_CLIENT_ID, TSIDP_CLIENT_SECRET and K8S_SA_ISSUER. It lives in
# controllers so the Secret already exists when configs is built.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: toolhive
  namespace: toolhive
spec:
  itemPath: "vaults/4kbytax7eoweefgrkbg2af6oxu/items/dqwf67g5vp6nuebssdnn3ijaqa"
