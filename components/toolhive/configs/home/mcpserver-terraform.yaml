---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpservers.schema.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: terraform
  namespace: toolhive
spec:
  image: docker.io/hashicorp/terraform-mcp-server:1.4.1@sha256:11dd418bba6003dd5777e9d0979b68de59929a155b355f338f407947e00e9d80
  transport: stdio
  groupRef:
    name: mcp
  env:
    - name: TFE_ADDRESS
      value: "https://app.terraform.io"
    - name: ENABLE_TF_OPERATIONS
      value: "true"
  secrets:
    - name: terraform-mcp
      key: credential
      targetEnvName: TFE_TOKEN
  # Sizes the proxy container only; the MCP server's own container is sized
  # through podTemplateSpec, which ToolHive merges by the container name mcp.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
