---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpremoteproxies.schema.json
# Entry point for Coder workspaces. It validates their projected ServiceAccount
# tokens, which it can do because a remote proxy authenticates its own fetch of
# the cluster's signing keys, and applies the tier rules before forwarding to
# VirtualMCPServer workspaces. Not named workspaces: a remote proxy's
# Deployment takes the resource name, which the gateway already uses.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPRemoteProxy
metadata:
  name: workspaces-auth
  namespace: toolhive
spec:
  remoteUrl: http://vmcp-workspaces.toolhive.svc.cluster.local:4483/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  oidcConfigRef:
    name: kubernetes
    audience: "http://mcp-workspaces-auth-remote-proxy.toolhive.svc.cluster.local:8080/mcp"
    # The operator's default derives a host from the resource name, which is
    # not the Service's name.
    resourceUrl: "http://mcp-workspaces-auth-remote-proxy.toolhive.svc.cluster.local:8080/mcp"
  authzConfigRef:
    name: mcp
