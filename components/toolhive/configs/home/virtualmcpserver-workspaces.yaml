---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/virtualmcpservers.schema.json
# Aggregates the mcp group for Coder workspaces behind MCPRemoteProxy
# workspaces-auth, which checks their ServiceAccount tokens. It cannot check them
# itself: a VirtualMCPServer fetches the cluster's signing keys without
# credentials, and Talos refuses anonymous API requests. NetworkPolicy
# workspaces admits only that proxy. The shared policy still applies here,
# with every request seen as sub=anonymous.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: workspaces
  namespace: toolhive
spec:
  groupRef:
    name: mcp
  incomingAuth:
    type: anonymous
    authzConfigRef:
      name: mcp
  outgoingAuth:
    source: discovered
