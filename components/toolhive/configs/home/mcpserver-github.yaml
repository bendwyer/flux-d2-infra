---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpservers.schema.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
  namespace: toolhive
spec:
  image: ghcr.io/github/github-mcp-server:v1.13.0@sha256:15b28878c7d46edf07e16c373e48144fbeb2c5cc464e723f252677fd82a91f5f
  transport: stdio
  groupRef:
    name: mcp
  secrets:
    - name: github-mcp
      key: credential
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  # Sizes the proxy container only; the MCP server's own container is sized
  # through podTemplateSpec, which ToolHive merges by the container name mcp.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
