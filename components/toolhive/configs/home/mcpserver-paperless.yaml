---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpservers.schema.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: paperless
  namespace: toolhive
spec:
  image: ghcr.io/bendwyer/containers/paperless-mcp:0.6@sha256:5c7b26b1b0af253b6e99a8d6ec8bb593fba594d6019a36e206219d9229c78d05
  transport: stdio
  # Without it the server listens for HTTP instead.
  args:
    - --stdio
  groupRef:
    name: mcp
  env:
    - name: PAPERLESS_BASE_URL
      value: "http://paperless-ngx.paperless-ngx.svc.cluster.local:8000"
  secrets:
    - name: paperless-mcp
      key: credential
      targetEnvName: PAPERLESS_API_TOKEN
  # Sizes the proxy container only; the MCP server's own container is sized
  # through podTemplateSpec, which ToolHive merges by the container name mcp.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
