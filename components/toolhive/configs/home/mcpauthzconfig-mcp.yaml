---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpauthzconfigs.schema.json
# Shared by every entry point so the forbid rules cannot drift between them:
# tsidp users on mcp, workspace ServiceAccounts on workspaces-auth, and the
# anonymous hop behind it. Cedar sees the token's sub as claim_sub.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPAuthzConfig
metadata:
  name: mcp
  namespace: toolhive
spec:
  type: cedarv1
  config:
    policies:
      - 'permit(principal, action == Action::"list_tools", resource);'
      # tsidp users, and the proxied calls VirtualMCPServer workspaces sees as
      # sub=anonymous. The has guard keeps a response without sub from denying
      # every call.
      - 'permit(principal, action == Action::"call_tool", resource) when { !(principal has claim_sub) || !(principal.claim_sub like "system:serviceaccount:*") };'
      # Workspace tiers only, at MCPRemoteProxy workspaces-auth. Every other
      # ServiceAccount's token passes token validation, so the subject is what
      # keeps them out.
      - 'permit(principal, action == Action::"call_tool", resource) when { principal.claim_sub == "system:serviceaccount:coder-workspaces:coder-workspace-operator" || principal.claim_sub == "system:serviceaccount:coder-workspaces:coder-workspace-dev" };'
      # The dev tier has no cluster access, so no flux-operator either.
      - 'forbid(principal, action == Action::"call_tool", resource) when { principal.claim_sub == "system:serviceaccount:coder-workspaces:coder-workspace-dev" && resource.name like "flux-operator_*" };'
      # Deletes go through a human-authenticated identity, never the gateway,
      # whatever a backend's own permissions allow. Cedar sees the name the
      # gateway advertises, backend prefix included. Backends separate words
      # with underscores or hyphens and may end a name with delete, so the
      # pattern matches the bare word.
      - 'forbid(principal, action == Action::"call_tool", resource) when { resource.name like "*delete*" };'
      # Sidero's docs server sends feedback to Sidero; nothing here should.
      - 'forbid(principal, action == Action::"call_tool", resource) when { resource.name == "sidero-docs_submit_feedback" };'
