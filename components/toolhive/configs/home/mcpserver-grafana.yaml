---
# yaml-language-server: $schema=https://docs.stacklok.com/api-specs/toolhive-crds/mcpservers.schema.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
  namespace: toolhive
spec:
  image: ghcr.io/bendwyer/containers/grafana-mcp:2.0.2@sha256:18895490dbe66ae5aadc0f716401b7581c0718dd89feb26e3a022d332950d5e0
  transport: stdio
  # The image's default command is --help.
  args:
    - --transport
    - stdio
  groupRef:
    name: mcp
  env:
    - name: GRAFANA_URL
      value: "http://grafana.grafana.svc.cluster.local"
  secrets:
    - name: grafana-mcp
      key: credential
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  # Sizes the proxy container only; the MCP server's own container is sized
  # through podTemplateSpec, which ToolHive merges by the container name mcp.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
