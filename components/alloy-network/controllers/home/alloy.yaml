---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: alloy-network
  namespace: alloy-network
spec:
  alloy:
    configMap:
      content: |-
        // Alloy's own internal metrics. alloy_* series, not otelcol_*.
        prometheus.exporter.self "network" { }

        discovery.relabel "self" {
        	targets = prometheus.exporter.self.network.targets

        	rule {
        		target_label = "job"
        		replacement  = "alloy-network"
        	}

        	rule {
        		target_label = "namespace"
        		replacement  = sys.env("POD_NAMESPACE")
        	}

        	rule {
        		target_label = "pod"
        		replacement  = sys.env("POD_NAME")
        	}
        }

        prometheus.scrape "self" {
        	targets         = discovery.relabel.self.output
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // Network flow metrics only, with every network setting except the destination
        // buckets at Beyla's default, including the socket_filter event source.
        beyla.ebpf "default" {
        	attributes {
        		kubernetes {
        			enable       = "true"
        			cluster_name = "home"
        		}

        		// Beyla's default flow attributes, plus the transport and the endpoint
        		// types, which separate pod traffic from node-to-node traffic, and the
        		// destination bucket.
        		select {
        			attr    = "beyla_network_flow_bytes"
        			include = [
        				"k8s.src.owner.name",
        				"k8s.src.namespace",
        				"k8s.dst.owner.name",
        				"k8s.dst.namespace",
        				"k8s.cluster.name",
        				"transport",
        				"k8s.src.type",
        				"k8s.dst.type",
        				"dst.cidr",
        			]
        		}
        	}

        	metrics {
        		features = ["network"]

        		// Without buckets, every unmappable destination shares one empty label value.
        		network {
        			cidrs = [
        				"10.244.0.0/16",
        				"10.96.0.0/12",
        				"100.64.0.0/10",
        				"192.168.10.0/24",
        				"192.168.99.0/24",
        				"192.168.188.0/24",
        				"192.168.200.0/24",
        				"192.168.0.0/16",
        				"172.16.0.0/12",
        				"10.0.0.0/8",
        				"0.0.0.0/0",
        			]
        		}
        	}
        }

        prometheus.scrape "beyla" {
        	targets         = beyla.ebpf.default.targets
        	honor_labels    = true
        	scrape_interval = "30s"
        	forward_to      = [prometheus.remote_write.default.receiver]
        }

        // Straight to Prometheus, labelled the same way as the other collectors.
        prometheus.remote_write "default" {
        	external_labels = {
        		cluster = "home",
        	}

        	endpoint {
        		url = "http://prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
        	}
        }
