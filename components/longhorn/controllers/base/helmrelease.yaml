---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  # install:
  #   remediation:
  #     retries: 3
  # interval: 10m
  # upgrade:
  #   remediation:
  #     retries: 3
  values:
    defaultSettings:
      allowCollectingLonghornUsageMetrics: false
      # Volumes otherwise keep the engine they were created with, so a chart
      # upgrade leaves them behind one version at a time. One per node keeps the
      # rollout serialised.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      defaultDataPath: /var/mnt/longhorn
      deletingConfirmationFlag: true
      # Drains once the replica has stopped, without copying it to another node first.
      nodeDrainPolicy: allow-if-replica-is-stopped
      storageReservedPercentageForDefaultDisk: 0
