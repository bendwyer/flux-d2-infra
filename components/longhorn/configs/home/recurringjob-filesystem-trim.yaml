---
# Reclaims blocks freed inside the filesystem; ordered after snapshot-daily
# so it sees the system snapshots that job purges. Blocks already in the base
# snapshot are not reclaimed until they are overwritten.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
  namespace: longhorn
spec:
  cron: "0 4 * * *"
  task: filesystem-trim
  groups:
    - default
  concurrency: 2
  retain: 0
