---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/networkpolicy-networking-v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    # The chart's own longhorn-manager policy admits Longhorn pods only, which drops
    # the alloy-node scrape of :9500 as soon as NetworkPolicy is actually enforced.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy-node
      ports:
        - protocol: TCP
          port: 9500
