---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus
  # Helm installs a chart's crds/ directory once and never upgrades it. The CRDs
  # are applied by prometheus-crds instead, which server-side applies them.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    fullnameOverride: "prometheus"

    # Drops the crds subchart, so prometheus-crds is the only writer.
    crds:
      enabled: false

    # --- Disable all bundled components — deployed as standalone ---
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    nodeExporter:
      enabled: false
    kubeStateMetrics:
      enabled: false
    defaultRules:
      create: false

    # --- Disable all scrape targets — OTel Gateway handles collection ---
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    coreDns:
      enabled: false

    # --- Prometheus Operator ---
    prometheusOperator:
      enabled: true

    # --- Prometheus Instance ---
    prometheus:
      enabled: true
      prometheusSpec:
        retention: "30d"
        enableRemoteWriteReceiver: true

        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 2Gi

        # Match resend-delay to the 30s rule eval interval so Watchdog
        # re-sends every 60s (every other eval) instead of the 90s default.
        additionalArgs:
          - name: rules.alert.resend-delay
            value: 30s

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        # Watch PrometheusRule CRDs across all namespaces
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}

        # Disable scraping — OTel handles collection
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector:
          matchLabels:
            prometheus_disabled: "true"
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector:
          matchLabels:
            prometheus_disabled: "true"
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector:
          matchLabels:
            prometheus_disabled: "true"
