---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: onepassword
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: onepassword-connect
  # Helm installs a chart's crds/ directory once and never upgrades it. The CRD
  # is applied by onepassword-connect-crds instead, which server-side applies it.
  install:
    crds: Skip
    # remediation:
    #   retries: 3
  upgrade:
    crds: Skip
    # remediation:
    #   retries: 3
  # Both secrets are seeded out of band before Flux runs, because they are what the
  # operator needs in order to fetch every other secret. Naming them here rather than
  # passing their contents through values means the chart templates no Secret of its
  # own, so there is one copy of each and none in Helm release storage.
  values:
    connect:
      credentialsName: onepassword-connect-credentials
    operator:
      autoRestart: true
      create: true
      token:
        name: onepassword-token
      pollingInterval: 60
