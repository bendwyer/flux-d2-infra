---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7-mcp
  namespace: agentgateway
  labels:
    app: context7-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context7-mcp
  template:
    metadata:
      labels:
        app: context7-mcp
    spec:
      containers:
        - name: context7-mcp
          image: ghcr.io/bendwyer/containers/context7-mcp:4.0.5@sha256:3b342d74e69c82b8f9365d4edad64ed6be84235f6c25447fb93f94d679c6a852
          args:
            - --transport
            - http
            - --port
            - "3000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: context7-mcp
  namespace: agentgateway
  labels:
    app: context7-mcp
spec:
  selector:
    app: context7-mcp
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      appProtocol: agentgateway.dev/mcp
  type: ClusterIP
