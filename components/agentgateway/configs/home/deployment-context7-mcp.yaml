---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context7-mcp
  namespace: agentgateway
  labels:
    app: context7-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context7-mcp
  template:
    metadata:
      labels:
        app: context7-mcp
    spec:
      containers:
        - name: context7-mcp
          image: ghcr.io/bendwyer/containers/context7-mcp:4.0.2@sha256:fbee6d9b1e3b0602e9a434eb011b84dabcb3b63a9068be1a4d78834d2c7ad128
          args:
            - --transport
            - http
            - --port
            - "3000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: context7-mcp
  namespace: agentgateway
  labels:
    app: context7-mcp
spec:
  selector:
    app: context7-mcp
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      appProtocol: agentgateway.dev/mcp
  type: ClusterIP
