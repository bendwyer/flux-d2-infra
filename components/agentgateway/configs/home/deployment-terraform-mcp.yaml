---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-mcp
  namespace: agentgateway
  labels:
    app: terraform-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terraform-mcp
  template:
    metadata:
      labels:
        app: terraform-mcp
    spec:
      containers:
        - name: terraform-mcp
          image: ghcr.io/bendwyer/containers/terraform-mcp:1.3@sha256:fbc54a9e24c4bcebe43574390a67c9d8f04504dc16799025aebe72403ba735d2
          args:
            - streamable-http
            - --transport-port
            - "8080"
            - --transport-host
            - 0.0.0.0
          env:
            - name: TFE_ADDRESS
              value: "https://app.terraform.io"
            - name: ENABLE_TF_OPERATIONS
              value: "true"
            - name: TFE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: terraform-mcp
                  key: credential
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-mcp
  namespace: agentgateway
  labels:
    app: terraform-mcp
spec:
  selector:
    app: terraform-mcp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      appProtocol: agentgateway.dev/mcp
  type: ClusterIP
