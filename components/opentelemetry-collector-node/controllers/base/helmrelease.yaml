---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-node
  namespace: opentelemetry-collector-node
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opentelemetry-collector-node
  # install:
  #   remediation:
  #     retries: 3
  # upgrade:
  #   cleanupOnFail: true
  #   remediation:
  #     retries: 3
  values:
    mode: daemonset
    image:
      repository: otel/opentelemetry-collector-contrib
    presets:
      # Log collection moved to alloy-node, which reads the same files and
      # writes to Loki directly. Disabling the preset also drops its host mounts.
      logsCollection:
        enabled: false
      kubernetesAttributes:
        enabled: true
        extractAllPodLabels: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 512Mi
    config:
      # Disable chart-default exporters and pipelines
      exporters:
        debug: null
      service:
        pipelines:
          logs: null
          metrics: null
          traces: null
      processors:
        batch:
          send_batch_size: 1024
          timeout: 2s
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
