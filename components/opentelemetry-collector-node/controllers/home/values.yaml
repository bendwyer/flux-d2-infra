---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector-node
  namespace: opentelemetry-collector-node
spec:
  interval: 1h
  values:
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources: [pods, namespaces, nodes, nodes/proxy, nodes/metrics]
          verbs: [get, list, watch]
        - apiGroups: [apps]
          resources: [replicasets]
          verbs: [get, list, watch]
        - nonResourceURLs: [/metrics, /metrics/cadvisor]
          verbs: [get]
    config:
      receivers:
        prometheus:
          config:
            global:
              scrape_interval: 30s
            scrape_configs:
              - job_name: node-exporter
                static_configs:
                  - targets:
                      - ${env:OTEL_K8S_NODE_IP}:9100
              - job_name: kubelet
                scheme: https
                tls_config:
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                static_configs:
                  - targets:
                      - ${env:OTEL_K8S_NODE_IP}:10250
              - job_name: cadvisor
                scheme: https
                tls_config:
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                metrics_path: /metrics/cadvisor
                static_configs:
                  - targets:
                      - ${env:OTEL_K8S_NODE_IP}:10250
                relabel_configs:
                  - target_label: job
                    replacement: kubelet
              - job_name: kube-proxy
                static_configs:
                  - targets:
                      - ${env:OTEL_K8S_NODE_IP}:10249
              - job_name: longhorn
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - longhorn
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app]
                    regex: longhorn-manager
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    regex: ${env:OTEL_K8S_NODE_NAME}
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: $1:9500
      processors:
        # Pod identity for telemetry pushed by applications running on this
        # node. Separate from the chart preset's k8s_attributes, which is only
        # added to the pipelines named exactly logs, metrics and traces.
        #
        # Senders declare their own pod IP and that is matched first. Relying on
        # the connection address alone attached nothing: applications reach this
        # agent through a host port, and whatever address arrived matched no pod.
        # Connection is kept as a fallback for anything that reaches the agent
        # without declaring an IP.
        #
        # service.* is deliberately not extracted: service.namespace becomes the
        # Prometheus job prefix, so extracting it would rename every series to
        # <namespace>/<service name> and split it from the same application
        # reporting from anywhere else.
        k8s_attributes/apps:
          filter:
            node_from_env_var: K8S_NODE_NAME
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: connection
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.pod.name
      exporters:
        otlp_grpc:
          endpoint: opentelemetry-collector-gateway.opentelemetry-collector-gateway.svc.cluster.local:4317
          tls:
            insecure: true
        # Application telemetry goes to its own gateway port, so the gateway can
        # export it with resource attributes converted to labels. The scrape
        # traffic on 4317 must not get that treatment.
        otlp_grpc/apps:
          endpoint: opentelemetry-collector-gateway.opentelemetry-collector-gateway.svc.cluster.local:4319
          tls:
            insecure: true
      service:
        pipelines:
          logs:
            receivers:
              - filelog
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlp_grpc
          metrics:
            receivers:
              - prometheus
            processors:
              - memory_limiter
              - batch
            exporters:
              - otlp_grpc
          # Applications on this node push to the agent's otlp receiver, which
          # has been listening on hostPort 4317 and 4318 all along but fed no
          # pipeline, so anything sent to it was accepted and dropped.
          logs/apps:
            receivers:
              - otlp
            processors:
              - k8s_attributes/apps
              - memory_limiter
              - batch
            exporters:
              - otlp_grpc/apps
          metrics/apps:
            receivers:
              - otlp
            processors:
              - k8s_attributes/apps
              - memory_limiter
              - batch
            exporters:
              - otlp_grpc/apps
        telemetry:
          metrics:
            level: detailed
          resource:
            service.namespace: node
            service.instance.id: ${env:OTEL_K8S_POD_NAME}
