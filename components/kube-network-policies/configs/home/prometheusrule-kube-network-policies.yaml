---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-network-policies
  namespace: kube-network-policies
  labels:
    app.kubernetes.io/part-of: k8s-monitoring
spec:
  groups:
    - name: kube-network-policies.rules
      rules:
        # Compared against the DaemonSet's own desired count rather than a literal, so
        # this keeps working when the node count changes.
        - alert: KubeNetworkPoliciesAgentMissing
          expr: |
            kube_daemonset_status_number_ready{daemonset="kube-network-policies"}
              < kube_daemonset_status_desired_number_scheduled{daemonset="kube-network-policies"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Policy engine not ready on every node"
            description: >-
              Only {{ $value }} agents are ready. Pods on a node without one are subject
              to whatever nftables state that node is left in, which is not what the
              policy objects say, in either direction. Check the DaemonSet's pods and
              their logs before assuming traffic is being evaluated anywhere.
        - alert: KubeNetworkPoliciesAgentNotScraped
          expr: up{job="kube-network-policies"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Policy engine metrics missing from {{ $labels.instance }}"
            description: >-
              The agent on {{ $labels.instance }} has not been scraped for 10 minutes.
              Enforcement may be unaffected, but the drop and queue alerts cannot see
              that node while this is firing.
        # Both counters stay at zero in normal operation, so any increase is real. The
        # process-age guard keeps a rollout from firing this: packets in flight when an
        # agent exits are counted as dropped by the queue it was reading.
        - alert: KubeNetworkPoliciesQueueShedding
          expr: |
            (
              increase(kube_network_policies_nfqueue_user_dropped[15m]) > 0
              or
              increase(kube_network_policies_nfqueue_queue_dropped[15m]) > 0
            )
            and on (instance)
            (time() - max by (instance) (process_start_time_seconds{job="kube-network-policies"}) > 900)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "nfqueue shed packets on {{ $labels.instance }} queue {{ $labels.queue }}"
            description: >-
              Packets left netfilter queue {{ $labels.queue }} without the engine
              deciding on them, either because the kernel filled the queue or because
              the read failed. The queue does not fail open, so those packets were
              dropped rather than allowed, and the workload sees it as an unexplained
              connection failure.
        # The cluster's steady state is below 0.5/s in total, so a per-node rate ten
        # times that is either a new deny rule working or a workload that lost a path.
        - alert: KubeNetworkPoliciesDropRateHigh
          expr: sum by (instance) (rate(kube_network_policies_packet_count{verdict="drop"}[5m])) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Policy denials on {{ $labels.instance }} sustained at {{ $value | printf \"%.1f\" }}/s"
            description: >-
              Denials on {{ $labels.instance }} have stayed an order of magnitude above
              the steady state for 10 minutes. Expected while a deny rule is being
              introduced. Otherwise find the source with the Beyla flow metrics, since
              the engine itself logs the pod behind a denial only at higher verbosity.
