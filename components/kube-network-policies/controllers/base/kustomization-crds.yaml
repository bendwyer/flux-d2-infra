---
# The experimental channel, for the domainNames and nodes peers the standard one omits.
# Each is the only key its peer can hold, so a release that drops one fails the apply on
# minProperties instead of pruning the rule and loosening enforcement unnoticed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policy-api-crds
  namespace: kube-network-policies
spec:
  interval: 1h
  path: config/crd/experimental
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: network-policy-api
