---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcp-terraform-operator
  namespace: hcp-terraform-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: hcp-terraform-operator
  # Helm installs a chart's crds/ directory once and never upgrades it. The CRDs
  # are applied by hcp-terraform-operator-crds instead, which server-side applies them.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    replicaCount: 1
    operator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 128Mi
      syncPeriod: 1h
    kubeRbacProxy:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 64Mi
